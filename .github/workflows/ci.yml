name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for secrets and bad files
        run: |
          FAIL=0
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E "^\.env|\.env\.local|\.env\.production"; then
            echo "❌ .env file committed"; FAIL=1
          fi
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E "^\.next/"; then
            echo "❌ .next/ build dir committed"; FAIL=1
          fi
          if git diff HEAD~1 HEAD -- . ':!.github/' 2>/dev/null | grep -E "rk_live_|sk_live_|pk_live_"; then
            echo "❌ Hardcoded Stripe key in diff"; FAIL=1
          fi
          if git diff HEAD~1 HEAD -- . ':!.github/' 2>/dev/null | grep -E "Bearer [a-zA-Z0-9_\-]{40,}"; then
            echo "❌ Possible hardcoded API token in diff"; FAIL=1
          fi
          [ $FAIL -eq 1 ] && exit 1 || echo "✅ Clean"

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --coverage

      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
