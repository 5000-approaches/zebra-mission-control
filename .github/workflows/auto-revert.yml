name: Auto-revert on CI failure

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-revert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate - decide if revert is needed
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          COMMIT_INFO=$(gh api repos/${{ github.repository }}/commits/$SHA)
          AUTHOR_EMAIL=$(echo "$COMMIT_INFO" | jq -r '.commit.author.email')
          COMMIT_MSG=$(echo "$COMMIT_INFO" | jq -r '.commit.message | split("\n")[0]')
          echo "author_email=$AUTHOR_EMAIL" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

          if [ "$AUTHOR_EMAIL" = "rune@5000approaches.io" ] || [ "$AUTHOR_EMAIL" = "rune@zebraconsulting.no" ]; then
            echo "Skipping - Rune-authored commit"
            echo "should_revert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMIT_MSG" | grep -q "^Revert"; then
            echo "Skipping - commit is already a revert (loop guard)"
            echo "should_revert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_EXISTS=$(gh api repos/${{ github.repository }}/branches \
            --jq ".[] | select(.name == \"revert-$SHORT_SHA\") | .name" 2>/dev/null || echo "")
          if [ -n "$BRANCH_EXISTS" ]; then
            echo "Skipping - revert branch already exists"
            echo "should_revert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_revert=true" >> "$GITHUB_OUTPUT"

      - name: Checkout dev
        if: steps.gate.outputs.should_revert == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        if: steps.gate.outputs.should_revert == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create revert branch and commit
        if: steps.gate.outputs.should_revert == 'true'
        id: revert
        run: |
          SHORT_SHA="${{ steps.gate.outputs.short_sha }}"
          SHA="${{ steps.gate.outputs.sha }}"
          BRANCH="revert-$SHORT_SHA"
          git checkout -b "$BRANCH"
          if git revert --no-edit "$SHA"; then
            git push origin "$BRANCH"
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            git revert --abort 2>/dev/null || true
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open revert PR
        if: |
          steps.gate.outputs.should_revert == 'true' &&
          steps.revert.outputs.success == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ steps.gate.outputs.commit_msg }}
        run: |
          SHORT_SHA="${{ steps.gate.outputs.short_sha }}"
          CI_RUN_URL="${{ github.event.workflow_run.html_url }}"
          BRANCH="${{ steps.revert.outputs.branch }}"
          PR_URL=$(gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "Revert: $COMMIT_MSG" \
            --body "$(printf 'Auto-revert of %s\n\nOriginal commit message:\n%s\n\nFailing CI run: %s' "$SHORT_SHA" "$COMMIT_MSG" "$CI_RUN_URL")")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Send Telegram alert (revert PR created)
        if: |
          steps.gate.outputs.should_revert == 'true' &&
          steps.revert.outputs.success == 'true'
        continue-on-error: true
        run: |
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && echo "TELEGRAM_BOT_TOKEN not set - skipping" && exit 0
          REPO="${{ github.repository }}"
          SHORT_SHA="${{ steps.gate.outputs.short_sha }}"
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          MSG="Auto-revert opened%0A%0ARepo: ${REPO}%0ASHA: ${SHORT_SHA}%0APR: ${PR_URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" > /dev/null

      - name: Send Telegram alert (conflict)
        if: |
          steps.gate.outputs.should_revert == 'true' &&
          steps.revert.outputs.success == 'false'
        continue-on-error: true
        run: |
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && echo "TELEGRAM_BOT_TOKEN not set - skipping" && exit 0
          REPO="${{ github.repository }}"
          SHORT_SHA="${{ steps.gate.outputs.short_sha }}"
          CI_RUN_URL="${{ github.event.workflow_run.html_url }}"
          MSG="Auto-revert conflict - manual fix needed%0A%0ARepo: ${REPO}%0ASHA: ${SHORT_SHA}%0ACI: ${CI_RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" > /dev/null
